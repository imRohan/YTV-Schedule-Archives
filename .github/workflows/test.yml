name: Test Running Scripts

on:
  push:
    branches:
      - main

jobs:
  scrape_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install

      - name: Debug
        run: ls $GITHUB_WORKSPACE

      - name: Debug2
        run: ls "${GITHUB_WORKSPACE}/scripts/"

      - name: Scrape Data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: ruby "${GITHUB_WORKSPACE}/scripts/find_youtube_links.rb"
